<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>acp — shell</title>
<style>
  :root{
    --void:#04060D; --ice:#7FE3FF; --warn:#FF9A6B; --good:#6FE0A8;
    --text:#CDE6F2; --dim:#587687; --line:rgba(127,227,255,.16);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--void);color:var(--text);font-family:var(--mono);font-size:13.5px;
       line-height:1.75;overflow:hidden}
  .scan{position:fixed;inset:0;pointer-events:none;z-index:9;opacity:.45;
        background:repeating-linear-gradient(to bottom,rgba(255,255,255,.02) 0 1px,transparent 1px 3px)}
  .frame{position:fixed;inset:14px;pointer-events:none;z-index:8}
  .frame i{position:absolute;width:22px;height:22px;border:1px solid var(--ice);opacity:.5}
  .frame .a{top:0;left:0;border-right:0;border-bottom:0}
  .frame .b{top:0;right:0;border-left:0;border-bottom:0}
  .frame .c{bottom:0;left:0;border-right:0;border-top:0}
  .frame .d{bottom:0;right:0;border-left:0;border-top:0}

  .shell{position:fixed;inset:38px;display:flex;flex-direction:column;z-index:5}
  .top{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);
       padding-bottom:10px;font-size:11px;letter-spacing:.16em;color:var(--dim)}
  .top b{color:var(--ice);font-weight:400}
  #out{flex:1;overflow-y:auto;padding:16px 0;scrollbar-width:thin}
  #out::-webkit-scrollbar{width:6px}
  #out::-webkit-scrollbar-thumb{background:rgba(127,227,255,.2)}
  .ln{white-space:pre-wrap;word-break:break-word}
  .ln.cmd{color:var(--ice)}
  .ln.dim{color:var(--dim)}
  .ln.good{color:var(--good)}
  .ln.warn{color:var(--warn)}
  .ln.head{color:#EAF8FF;letter-spacing:.06em}
  .row{display:flex;gap:10px;align-items:baseline;border-top:1px solid var(--line);padding-top:12px}
  .ps{color:var(--good);white-space:nowrap}
  #in{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;caret-color:var(--ice)}
  .hints{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px}
  .hint{font-size:11px;letter-spacing:.1em;color:var(--dim);border:1px solid var(--line);
        padding:6px 11px;cursor:pointer;background:rgba(127,227,255,.03);transition:.18s ease}
  .hint:hover{color:var(--ice);border-color:var(--ice);background:rgba(127,227,255,.1)}
  .hint.plain{color:var(--warn);border-color:rgba(255,154,107,.35)}
  .hint.plain:hover{color:var(--warn);border-color:var(--warn);background:rgba(255,154,107,.1)}
  @media (max-width:700px){.shell{inset:20px}body{font-size:12.5px}}
</style>
</head>
<body>
<div class="scan"></div>
<div class="frame"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div>

<div class="shell">
  <div class="top"><span>acp<b>.x</b> &nbsp;//&nbsp; aditya chandra prajapati</span><span id="clock">--:--:--</span></div>
  <div id="out"></div>
  <div class="row"><span class="ps">acp@x:~$</span><input id="in" autocomplete="off" spellcheck="false" autofocus></div>
  <div class="hints" id="hints"></div>
</div>

<script>
window.__err = null;
window.addEventListener('error', e => { window.__err = e.message; });

(function () {
  var out = document.getElementById('out'), inp = document.getElementById('in');
  var hist = [], hi = -1;

  function put(text, cls, delay) {
    var d = document.createElement('div');
    d.className = 'ln' + (cls ? ' ' + cls : '');
    d.textContent = text;
    out.appendChild(d);
    out.scrollTop = out.scrollHeight;
    return d;
  }

  var CMDS = {
    help: function () {
      put('available commands', 'head');
      put('  about      who I am and what I want', 'dim');
      put('  work       what exists, and what does not', 'dim');
      put('  stack      what I can actually defend', 'dim');
      put('  status     honest numbers about this site', 'dim');
      put('  contact    how to reach me', 'dim');
      put('  open <id>  open a record, e.g. open 001', 'dim');
      put('  plain      everything at once, no shell', 'dim');
      put('  clear      wipe the screen', 'dim');
    },
    about: function () {
      put('aditya chandra prajapati', 'head');
      put('backend developer. graduated may 2026. based in pune.');
      put('i like the part of a system nobody sees - what happens');
      put('between the click and the answer.');
      put('');
      put('this site is built in the open. everything on it is real,', 'dim');
      put('or it is marked as missing.', 'dim');
    },
    work: function () {
      put('records', 'head');
      put('  001  snake            c++ / terminal      draft', 'good');
      put('  002  --               --                  locked', 'dim');
      put('  003  --               --                  locked', 'dim');
      put('');
      put('two slots are empty on purpose. they stay empty until', 'warn');
      put('there is something real to put in them.', 'warn');
      put('');
      put('try: open 001', 'dim');
    },
    stack: function () {
      put('stack', 'head');
      put('  c++         snake, student records. wrote the loop myself.', 'good');
      put('  javascript  night cravings, this site.', 'good');
      put('  sql         queries, joins, indexes. still learning depth.', 'dim');
      put('  power bi    patient summary dashboard.', 'good');
      put('');
      put('not listed: anything i could not defend in an interview.', 'warn');
    },
    status: function () {
      put('system status', 'head');
      put('  records published    0 of 3', 'warn');
      put('  repositories         10 (3 empty)', 'warn');
      put('  role target          backend developer', 'good');
      put('  site                 online', 'good');
      put('  portfolio complete   23%', 'warn');
    },
    contact: function () {
      put('channel open', 'head');
      put('  github    github.com/air01aditya', 'good');
      put('  email     on request', 'dim');
      put('');
      put('if you are hiring backend, say so and i will reply the same day.');
    },
    plain: function () {
      CMDS.about(); put(''); CMDS.work(); put(''); CMDS.stack(); put(''); CMDS.contact();
    },
    clear: function () { out.innerHTML = ''; },
    open: function (arg) {
      if (arg === '001') {
        put('record 001 - snake', 'head');
        put('  c++17, terminal, no engine, no dependencies.');
        put('  problem   wanted to write the game loop myself.');
        put('  approach  body as a queue: push head, pop tail.');
        put('  broke     collision ran after render, so it checked', 'warn');
        put('            the drawn frame instead of the real state.', 'warn');
        put('  result    clean at speed. compiles to webassembly.', 'good');
      } else if (arg === '002' || arg === '003') {
        put('record ' + arg + ' is locked.', 'warn');
        put('nothing real here yet. check back.', 'dim');
      } else {
        put('no such record: ' + (arg || '(none)'), 'warn');
        put('try: open 001', 'dim');
      }
    }
  };

  function run(raw) {
    var line = raw.trim();
    put('acp@x:~$ ' + line, 'cmd');
    if (!line) return;
    hist.push(line); hi = hist.length;
    var parts = line.split(/\s+/), cmd = parts[0].toLowerCase(), arg = parts[1];
    if (CMDS[cmd]) CMDS[cmd](arg);
    else {
      put('command not found: ' + cmd, 'warn');
      put("type 'help' for the list, or press the buttons below.", 'dim');
    }
    put('');
  }

  inp.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { run(inp.value); inp.value = ''; }
    else if (e.key === 'ArrowUp') {
      if (hi > 0) { hi--; inp.value = hist[hi] || ''; }
      e.preventDefault();
    } else if (e.key === 'ArrowDown') {
      if (hi < hist.length - 1) { hi++; inp.value = hist[hi] || ''; }
      else { hi = hist.length; inp.value = ''; }
      e.preventDefault();
    } else if (e.key === 'Tab') {
      e.preventDefault();
      var v = inp.value.trim().toLowerCase();
      if (!v) return;
      var m = Object.keys(CMDS).filter(function (k) { return k.indexOf(v) === 0; });
      if (m.length === 1) inp.value = m[0] + ' ';
    }
  });

  // buttons for anyone who does not want to type
  var HINTS = [['about','about'],['work','work'],['stack','stack'],['status','status'],
               ['contact','contact'],['help','help'],['everything at once','plain']];
  var hints = document.getElementById('hints');
  HINTS.forEach(function (h) {
    var b = document.createElement('button');
    b.className = 'hint' + (h[1] === 'plain' ? ' plain' : '');
    b.textContent = h[0];
    b.addEventListener('click', function () { run(h[1]); inp.focus(); });
    hints.appendChild(b);
  });

  document.addEventListener('click', function (e) {
    if (e.target.tagName !== 'BUTTON') inp.focus();
  });

  function tick() {
    var d = new Date();
    document.getElementById('clock').textContent =
      String(d.getHours()).padStart(2,'0') + ':' +
      String(d.getMinutes()).padStart(2,'0') + ':' +
      String(d.getSeconds()).padStart(2,'0');
  }
  tick(); setInterval(tick, 1000);

  // boot
  put('acp.x shell — type a command, or press a button below', 'dim');
  put('');
  CMDS.about();
  put('');
  put("type 'help' to see everything.", 'dim');
  put('');
})();
</script>
</body>
</html>
