<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACP.X — concept 3 — Mission terminal</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #06070A; color: #C8CCD2; overflow: hidden;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px; line-height: 1.6;
  }
  /* faint scanlines over everything */
  .scan {
    position: fixed; inset: 0; pointer-events: none; z-index: 20; opacity: .5;
    background: repeating-linear-gradient(
      to bottom, rgba(255,255,255,.022) 0 1px, transparent 1px 3px);
  }
  .frame { position: fixed; inset: 22px; pointer-events: none; z-index: 10; }
  .frame span {
    position: absolute; width: 22px; height: 22px;
    border: 1px solid #C6613F; opacity: .85;
  }
  .frame .tl { top: 0; left: 0; border-right: 0; border-bottom: 0; }
  .frame .tr { top: 0; right: 0; border-left: 0; border-bottom: 0; }
  .frame .bl { bottom: 0; left: 0; border-right: 0; border-top: 0; }
  .frame .br { bottom: 0; right: 0; border-left: 0; border-top: 0; }

  .wrap { position: fixed; inset: 46px; display: grid; grid-template-rows: auto 1fr auto; gap: 18px; }

  .top { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #16181F; padding-bottom: 12px; }
  .top .id { color: #C6613F; letter-spacing: .2em; font-size: 11px; }
  .top .who { color: #E8ECF2; font-size: 15px; letter-spacing: .04em; }
  .top .sys { color: #454B57; font-size: 11px; letter-spacing: .14em; }

  .body { display: grid; grid-template-columns: 300px 1fr; gap: 26px; min-height: 0; }
  .list { border-right: 1px solid #16181F; padding-right: 22px; overflow-y: auto; }
  .list h3, .detail h3 {
    margin: 0 0 12px; font-size: 10px; letter-spacing: .24em; color: #454B57; font-weight: 400;
  }
  .row {
    display: grid; grid-template-columns: 34px 1fr; gap: 10px;
    padding: 9px 10px; margin: 0 -10px; cursor: pointer; border-radius: 4px;
    color: #8A919E; transition: background .18s ease, color .18s ease;
  }
  .row:hover { background: #0D1017; color: #C8CCD2; }
  .row.on { background: #12151D; color: #E8ECF2; }
  .row .n { color: #454B57; }
  .row.on .n { color: #C6613F; }
  .row .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .s { font-size: 10px; letter-spacing: .12em; color: #454B57; }

  .detail { overflow-y: auto; padding-right: 6px; min-height: 0; }
  .detail .title { color: #E8ECF2; font-size: 19px; letter-spacing: .02em; margin: 0 0 2px; }
  .detail .meta { color: #C6613F; font-size: 10px; letter-spacing: .2em; margin: 0 0 22px; }
  .block { margin: 0 0 18px; }
  .block .k { color: #454B57; font-size: 10px; letter-spacing: .22em; display: block; margin-bottom: 5px; }
  .block .v { color: #A8AEB9; max-width: 62ch; }
  .block.broke .v { color: #C8CCD2; }
  .block.broke .k { color: #C6613F; }

  .bars { display: flex; gap: 4px; align-items: flex-end; height: 26px; margin-top: 26px; }
  .bars i { display: block; width: 5px; background: #C6613F; opacity: .8; border-radius: 1px; }

  .bottom { display: flex; justify-content: space-between; align-items: center;
            border-top: 1px solid #16181F; padding-top: 12px; color: #454B57; font-size: 11px; }
  .escape {
    font-family: inherit; font-size: 11px; color: #8A919E; background: none;
    border: 1px solid #1D212A; padding: 7px 13px; border-radius: 4px; cursor: pointer;
    letter-spacing: .08em;
  }
  .escape:hover { color: #E8ECF2; border-color: #2E3440; }
  .cursor { color: #C6613F; animation: blink 1.1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  @media (max-width: 760px) {
    .body { grid-template-columns: 1fr; }
    .list { border-right: 0; border-bottom: 1px solid #16181F; padding: 0 0 16px; max-height: 34vh; }
  }
</style>
</head>
<body>
<div class="scan"></div>
<div class="frame"><span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span></div>

<div class="wrap">
  <div class="top">
    <div>
      <div class="id">PROOF OF WORK · ACP.X</div>
      <div class="who" id="who">Aditya Chandra Prajapati</div>
    </div>
    <div class="sys" id="sys">6 RECORDS · ALL VERIFIED</div>
  </div>

  <div class="body">
    <div class="list">
      <h3>RECORDS</h3>
      <div id="rows"></div>
    </div>
    <div class="detail">
      <h3>DETAIL</h3>
      <p class="title" id="d-title"></p>
      <p class="meta" id="d-meta"></p>
      <div class="block"><span class="k">PROBLEM</span><span class="v" id="d-problem"></span></div>
      <div class="block"><span class="k">APPROACH</span><span class="v" id="d-approach"></span></div>
      <div class="block broke"><span class="k">WHAT BROKE</span><span class="v" id="d-broke"></span></div>
      <div class="block"><span class="k">RESULT</span><span class="v" id="d-result"></span></div>
      <div class="bars" id="bars"></div>
    </div>
  </div>

  <div class="bottom">
    <button class="escape" id="escape">See a plain list instead</button>
    <span>concept 3 — mission terminal <span class="cursor">&#9608;</span></span>
  </div>
</div>

<script>
const PROJECTS = [
  { code:'001', name:'Snake Game', meta:'C++ · TERMINAL',
    problem:'Wanted a game with no engine and no libraries — just the language.',
    approach:'Terminal rendering in C++, a custom queue for the snake body.',
    broke:'Collision checks ran after the render, so fast turns clipped a frame late.',
    result:'Plays clean at speed. Compiles to WebAssembly, so it can run in a browser.' },
  { code:'002', name:'Night Cravings', meta:'JAVASCRIPT',
    problem:'Ordering late at night means scrolling menus that assume daylight.',
    approach:'Plain JavaScript, no framework. Built for thumbs and dark rooms.',
    broke:'State lived in the DOM, so the cart desynced on back navigation.',
    result:'Single page, loads instantly, nothing to install.' },
  { code:'003', name:'Aditya Blog', meta:'JAVASCRIPT',
    problem:'Needed somewhere to write things down as I learned them.',
    approach:'Static build, posts as files rather than a database.',
    broke:'node_modules got committed — 72MB in the repo before I caught it.',
    result:'Publishes from a push. Taught me what .gitignore is for.' },
  { code:'004', name:'Patient Dashboard', meta:'POWER BI',
    problem:'Clinical summaries were read across several disconnected reports.',
    approach:'One Power BI view — cohort, trend and outlier on a single screen.',
    broke:'Averages hid the outliers that actually mattered.',
    result:'A reader finds the exception in seconds instead of minutes.' },
  { code:'005', name:'Coffee Shop Sales', meta:'EXCEL · KPI',
    problem:'Sales data existed but nobody could see the shape of a day in it.',
    approach:'Hourly trend, product mix and size split against footfall.',
    broke:'Footfall and sales were on different time grains — the join was wrong.',
    result:'The afternoon dip turned out to be a staffing gap, not demand.' },
  { code:'006', name:'Student Records', meta:'C++ · FILE I/O',
    problem:'Record keeping by hand, with no way to search it.',
    approach:'C++ with file-backed storage and its own record format.',
    broke:'A partial write on crash left the file unreadable.',
    result:'Writes atomically now. Survives being killed mid-save.' },
];

const rows = document.getElementById('rows');
PROJECTS.forEach((p, i) => {
  const el = document.createElement('div');
  el.className = 'row';
  el.innerHTML = '<span class="n">' + p.code + '</span><span><span class="t">' + p.name +
                 '</span><br><span class="s">' + p.meta + '</span></span>';
  el.addEventListener('click', () => select(i));
  rows.appendChild(el);
});

const CHARS = '▚▞▘▝▖▗ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&@';
function decode(el, text, ms) {
  const start = performance.now();
  const dur = ms || 420;
  (function step(now) {
    const t = Math.min(1, (now - start) / dur);
    const keep = Math.floor(text.length * t);
    let out = text.slice(0, keep);
    for (let i = keep; i < text.length; i++) {
      out += text[i] === ' ' ? ' ' : CHARS[(Math.random() * CHARS.length) | 0];
    }
    el.textContent = out;
    if (t < 1) requestAnimationFrame(step);
    else el.textContent = text;
  })(start);
}

function select(i) {
  const p = PROJECTS[i];
  [...rows.children].forEach((r, j) => r.classList.toggle('on', j === i));
  decode(document.getElementById('d-title'), p.name, 360);
  decode(document.getElementById('d-meta'), p.meta, 300);
  document.getElementById('d-problem').textContent = p.problem;
  document.getElementById('d-approach').textContent = p.approach;
  document.getElementById('d-broke').textContent = p.broke;
  document.getElementById('d-result').textContent = p.result;
  const bars = document.getElementById('bars');
  bars.innerHTML = '';
  for (let b = 0; b < 26; b++) {
    const i2 = document.createElement('i');
    i2.style.height = (5 + Math.random() * 21).toFixed(0) + 'px';
    i2.style.opacity = (0.25 + Math.random() * 0.6).toFixed(2);
    bars.appendChild(i2);
  }
}

decode(document.getElementById('who'), 'Aditya Chandra Prajapati', 700);
decode(document.getElementById('sys'), '6 RECORDS · ALL VERIFIED', 900);
select(0);

document.getElementById('escape').addEventListener('click', () => {
  alert('This would go to a plain, boring list of every project.\n\nThe escape hatch for anyone who does not want a HUD.');
});
</script>
</body>
</html>
