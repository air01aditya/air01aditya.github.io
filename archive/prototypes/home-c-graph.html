<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACP.X — pull it apart</title>
<style>
  :root{
    --void:#04060D; --ice:#7FE3FF; --warn:#FF9A6B; --good:#6FE0A8;
    --text:#CDE6F2; --dim:#587687; --line:rgba(127,227,255,.16);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--void);color:var(--text);font-family:var(--sans);overflow:hidden}
  #g{position:fixed;inset:0;cursor:grab;touch-action:none}
  #g.drag{cursor:grabbing}
  .frame{position:fixed;inset:16px;pointer-events:none;z-index:8}
  .frame i{position:absolute;width:24px;height:24px;border:1px solid var(--ice);opacity:.45}
  .frame .a{top:0;left:0;border-right:0;border-bottom:0}
  .frame .b{top:0;right:0;border-left:0;border-bottom:0}
  .frame .c{bottom:0;left:0;border-right:0;border-top:0}
  .frame .d{bottom:0;right:0;border-left:0;border-top:0}
  .lab{font-family:var(--mono);font-size:10px;letter-spacing:.26em;color:var(--dim)}

  header{position:fixed;top:34px;left:40px;z-index:6}
  header h1{margin:6px 0 0;font-size:19px;font-weight:600;letter-spacing:-.02em}
  .tip{position:fixed;bottom:32px;left:40px;z-index:6;max-width:40ch;line-height:1.6}
  .tip b{color:var(--ice)}

  aside{position:fixed;right:0;top:0;bottom:0;width:360px;max-width:86vw;z-index:7;
        background:rgba(8,10,18,.96);border-left:1px solid var(--line);padding:34px 30px;
        transform:translateX(100%);transition:transform .4s cubic-bezier(.22,.7,.3,1);overflow-y:auto}
  aside.open{transform:none}
  aside h2{margin:0 0 4px;font-size:21px;font-weight:600}
  aside .kind{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--ice);margin:0 0 18px}
  aside p{font-size:14px;line-height:1.65;color:#A6C0CE;margin:0 0 13px}
  aside .k{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.18em;
           color:var(--dim);margin-bottom:3px}
  aside .x{position:absolute;top:22px;right:26px;background:none;border:0;color:var(--dim);
           font-size:22px;cursor:pointer;line-height:1}
  aside .x:hover{color:var(--text)}
  @media (max-width:700px){header,.tip{left:24px}.tip{max-width:70vw;font-size:13px}}
</style>
</head>
<body>
<canvas id="g"></canvas>
<div class="frame"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div>

<header>
  <div class="lab">BACKEND DEVELOPER &middot; PUNE</div>
  <h1>Aditya Chandra Prajapati</h1>
</header>
<p class="tip lab"><b>DRAG ANY NODE.</b> THE WHOLE THING REACTS. CLICK ONE TO OPEN IT.</p>

<aside id="panel">
  <button class="x" id="close">&times;</button>
  <h2 id="pTitle"></h2>
  <p class="kind" id="pKind"></p>
  <div id="pBody"></div>
</aside>

<script>
window.__err = null;
window.addEventListener('error', e => { window.__err = e.message; });

(function () {
  var cv = document.getElementById('g'), ctx = cv.getContext('2d');
  var W = 0, H = 0;

  var DATA = [
    { id:'me',   label:'ACP',            kind:'ROOT',     r:26, hue:'ice',
      body:['Backend developer, graduated May 2026, based in Pune.',
            'Everything attached to this node is either real or marked as missing.'] },
    { id:'cpp',  label:'C++',            kind:'LANGUAGE', r:17, hue:'ice', to:'me',
      body:['Where I actually wrote the loop myself rather than sitting on a framework.',
            'Two projects lean on it: Snake and Student Records.'] },
    { id:'js',   label:'JavaScript',     kind:'LANGUAGE', r:17, hue:'ice', to:'me',
      body:['Night Cravings and this site. No framework in either.'] },
    { id:'sql',  label:'SQL',            kind:'LANGUAGE', r:14, hue:'dim', to:'me',
      body:['Queries, joins, indexes. Honest position: I can write it, I am still',
            'learning where it gets slow and why.'] },
    { id:'data', label:'Data',           kind:'DOMAIN',   r:15, hue:'ice', to:'me',
      body:['Two real dashboards built from real data, which is more than most',
            'of my repositories can say.'] },
    { id:'snake',label:'Snake',          kind:'RECORD 001', r:15, hue:'good', to:'cpp',
      body:['C++17, terminal, no engine, no dependencies.',
            'PROBLEM|Wanted to write the game loop by hand for once.',
            'APPROACH|Body as a queue. Push head, pop tail.',
            'BROKE|Collision ran after render, so it checked the drawn frame.',
            'RESULT|Clean at speed. Compiles to WebAssembly.'] },
    { id:'recs', label:'Student Records',kind:'PROJECT',  r:13, hue:'ice', to:'cpp',
      body:['C++ with file-backed storage and its own record format.',
            'BROKE|A partial write on crash left the file unreadable.',
            'RESULT|Writes atomically now.'] },
    { id:'night',label:'Night Cravings', kind:'PROJECT',  r:13, hue:'ice', to:'js',
      body:['Plain JavaScript, no framework. Built for thumbs and dark rooms.'] },
    { id:'bi',   label:'Patient Dash',   kind:'PROJECT',  r:13, hue:'ice', to:'data',
      body:['Power BI. Cohort, trend and outlier on one screen.',
            'BROKE|Averages hid the outliers that actually mattered.'] },
    { id:'cof',  label:'Coffee Sales',   kind:'PROJECT',  r:13, hue:'ice', to:'data',
      body:['Excel. Hourly trend and product mix against footfall.',
            'RESULT|The afternoon dip was a staffing gap, not demand.'] },
    { id:'l2',   label:'Locked',         kind:'EMPTY',    r:11, hue:'warn', to:'me',
      body:['Record 002. Nothing here yet, and it will not pretend otherwise.'] },
    { id:'l3',   label:'Locked',         kind:'EMPTY',    r:11, hue:'warn', to:'me',
      body:['Record 003. Same.'] }
  ];

  var COL = { ice:'127,227,255', good:'111,224,168', warn:'255,154,107', dim:'88,118,135' };
  var N = [], E = [], drag = null, hover = null, down = false, moved = 0;

  function layout(first) {
    var d = window.devicePixelRatio || 1;
    W = innerWidth; H = innerHeight;
    cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
    if (first) {
      N = DATA.map(function (n, i) {
        return Object.assign({}, n, {
          x: W / 2 + Math.cos(i / DATA.length * 6.283) * Math.min(W, H) * .26,
          y: H / 2 + Math.sin(i / DATA.length * 6.283) * Math.min(W, H) * .26,
          vx: 0, vy: 0, lit: 0
        });
      });
      N[0].x = W / 2; N[0].y = H / 2;
      E = [];
      N.forEach(function (n) {
        if (!n.to) return;
        var t = N.findIndex(function (m) { return m.id === n.to; });
        if (t >= 0) E.push([N.indexOf(n), t]);
      });
    }
  }
  layout(true);
  addEventListener('resize', function () { layout(false); });

  function step() {
    // repulsion
    for (var i = 0; i < N.length; i++) for (var j = i + 1; j < N.length; j++) {
      var a = N[i], b = N[j];
      var dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
      var f = Math.min(2.4, 5200 / (d * d));
      a.vx -= dx / d * f; a.vy -= dy / d * f;
      b.vx += dx / d * f; b.vy += dy / d * f;
    }
    // springs
    for (var e = 0; e < E.length; e++) {
      var p = N[E[e][0]], q = N[E[e][1]];
      var dx2 = q.x - p.x, dy2 = q.y - p.y, d2 = Math.hypot(dx2, dy2) || 1;
      var rest = 132, k = (d2 - rest) * .0055;
      p.vx += dx2 / d2 * k; p.vy += dy2 / d2 * k;
      q.vx -= dx2 / d2 * k; q.vy -= dy2 / d2 * k;
    }
    for (var m = 0; m < N.length; m++) {
      var n = N[m];
      if (n === drag) { n.vx = 0; n.vy = 0; continue; }
      // gentle pull home so it never drifts off screen
      n.vx += (W / 2 - n.x) * .00045;
      n.vy += (H / 2 - n.y) * .00045;
      n.vx *= .90; n.vy *= .90;
      n.x += n.vx; n.y += n.vy;
      n.x = Math.max(n.r + 12, Math.min(W - n.r - 12, n.x));
      n.y = Math.max(n.r + 12, Math.min(H - n.r - 12, n.y));
    }
  }

  function draw() {
    step();
    ctx.clearRect(0, 0, W, H);
    ctx.lineWidth = 1;
    for (var e = 0; e < E.length; e++) {
      var p = N[E[e][0]], q = N[E[e][1]];
      var on = (hover && (hover === p || hover === q)) ? .55 : .14;
      ctx.strokeStyle = 'rgba(127,227,255,' + on + ')';
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
    }
    for (var i = 0; i < N.length; i++) {
      var n = N[i], c = COL[n.hue] || COL.ice;
      var big = (n === hover || n === drag);
      if (big) {
        var g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r * 2.6);
        g.addColorStop(0, 'rgba(' + c + ',.35)'); g.addColorStop(1, 'rgba(' + c + ',0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(n.x, n.y, n.r * 2.6, 0, 6.283); ctx.fill();
      }
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 6.283);
      ctx.fillStyle = 'rgba(4,6,13,.9)'; ctx.fill();
      ctx.strokeStyle = 'rgba(' + c + ',' + (big ? .95 : .45) + ')';
      ctx.lineWidth = n.kind === 'ROOT' ? 2 : 1.3;
      if (n.kind === 'EMPTY') ctx.setLineDash([4, 4]);
      ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(' + c + ',' + (big ? 1 : .8) + ')';
      ctx.font = (n.kind === 'ROOT' ? '600 13px ' : '500 12px ') + 'system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(n.label, n.x, n.y + n.r + 17);
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  function at(x, y) {
    for (var i = N.length - 1; i >= 0; i--) {
      if (Math.hypot(N[i].x - x, N[i].y - y) < N[i].r + 8) return N[i];
    }
    return null;
  }
  function pos(e) {
    var r = cv.getBoundingClientRect();
    var t = e.touches && e.touches[0] ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }

  function start(e) {
    var p = pos(e); down = true; moved = 0;
    drag = at(p.x, p.y);
    cv.classList.toggle('drag', !!drag);
  }
  function move(e) {
    var p = pos(e);
    if (down) moved++;
    if (drag) { drag.x = p.x; drag.y = p.y; }
    else hover = at(p.x, p.y);
  }
  function end(e) {
    if (drag && moved < 4) open(drag);
    else if (!drag && down && moved < 4) {
      var p = pos(e.changedTouches ? { touches: e.changedTouches } : e);
      var n = at(p.x, p.y); if (n) open(n);
    }
    drag = null; down = false; cv.classList.remove('drag');
  }
  cv.addEventListener('mousedown', start);
  addEventListener('mousemove', move, { passive: true });
  addEventListener('mouseup', end);
  cv.addEventListener('touchstart', function (e) { start(e); }, { passive: true });
  cv.addEventListener('touchmove', function (e) { move(e); }, { passive: true });
  cv.addEventListener('touchend', end);

  var panel = document.getElementById('panel');
  function open(n) {
    document.getElementById('pTitle').textContent = n.label;
    document.getElementById('pKind').textContent = n.kind;
    var b = document.getElementById('pBody');
    b.innerHTML = '';
    n.body.forEach(function (line) {
      var p = document.createElement('p');
      if (line.indexOf('|') > -1) {
        var bits = line.split('|');
        var k = document.createElement('span');
        k.className = 'k'; k.textContent = bits[0];
        p.appendChild(k);
        p.appendChild(document.createTextNode(bits[1]));
      } else p.textContent = line;
      b.appendChild(p);
    });
    panel.classList.add('open');
  }
  document.getElementById('close').addEventListener('click', function () {
    panel.classList.remove('open');
  });
})();
</script>
</body>
</html>
