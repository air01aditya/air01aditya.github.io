  :root { color-scheme: light; }
  * { box-sizing: border-box; }

    font-family: -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;

  #stage {
    position: fixed; inset: 0;
    display: grid; place-items: center;

  #stars { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
  #black { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; }
  #panel {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; gap: 10px; justify-content: center; align-items: center;
    padding: 16px; z-index: 10;
  }
  button {
    font: 500 13px -apple-system, "Segoe UI", sans-serif;
    padding: 9px 16px; border-radius: 8px;
    border: 1px solid #C6613F; background: #C6613F; color: #FCFCFB;
    cursor: pointer;
  }
  button.ghost { background: transparent; color: #6B6A63; border-color: #D9D8D0; }
  button:hover { background: #AE5133; border-color: #AE5133; color: #FCFCFB; }
  #hint {
    position: fixed; top: 18px; left: 0; right: 0; text-align: center;
    font-size: 12px; letter-spacing: .05em; color: #A9A79D;
  }
</style>

<canvas id="stars"></canvas>
<div id="black"></div>
<div id="panel">
  <button id="replay">Replay</button>
  <button class="ghost" id="slow">Slow motion: off</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function () {
  var CX = 480.0, CY = 118.0;
  var WRITE = [{"k":"ditya","w":238},{"k":"handra","w":232},{"k":"rajapati","w":245}];
  var stars = document.getElementById('stars');
  var ctx = stars.getContext('2d');
  var tl = null, slow = false, raf = null, t0 = 0;

  function sizeCanvas() {
    var d = window.devicePixelRatio || 1;
    stars.width = innerWidth * d;
    stars.height = innerHeight * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  addEventListener('resize', sizeCanvas);
  sizeCanvas();

  // Screen position of the C, so particles swirl around the real letter.
  function cScreen() {
    var r = document.getElementById('seg-C').getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  var P = [];
  for (var i = 0; i < 260; i++) {
    P.push({
      a: Math.random() * Math.PI * 2,
      r: 120 + Math.random() * 620,
      sp: 0.5 + Math.random() * 1.6,
      len: 6 + Math.random() * 26,
      w: 0.4 + Math.random() * 1.1
    });
  }

  function drawStars(now) {
    var dt = Math.min(48, now - t0);
    t0 = now;
    var k = slow ? 0.4 : 1;
    var c = cScreen();
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ctx.lineCap = 'round';
    for (var j = 0; j < P.length; j++) {
      var p = P[j];
      p.a += (p.sp * 0.0016 * dt * k) * (1 + 140 / Math.max(40, p.r));
      p.r -= p.sp * 0.052 * dt * k;
      if (p.r < 26) {
        p.r = 520 + Math.random() * 320;
        p.a = Math.random() * Math.PI * 2;
      }
      var x1 = c.x + Math.cos(p.a) * p.r;
      var y1 = c.y + Math.sin(p.a) * p.r * 0.62;
      var a2 = p.a - p.len / Math.max(60, p.r);
      var r2 = p.r + p.len * 0.5;
      var x2 = c.x + Math.cos(a2) * r2;
      var y2 = c.y + Math.sin(a2) * r2 * 0.62;
      var fade = Math.max(0, Math.min(1, (620 - p.r) / 420));
      ctx.strokeStyle = 'rgba(16,16,16,' + (0.10 + fade * 0.55) + ')';
      ctx.lineWidth = p.w;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }
    raf = requestAnimationFrame(drawStars);
  }

  function stopStars() {
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    ctx.clearRect(0, 0, innerWidth, innerHeight);
  }

  function build() {
    stopStars();
    gsap.set('.seg', { opacity: 0 });
    gsap.set('#scene', { scale: 1, transformOrigin: CX + 'px ' + CY + 'px' });
    gsap.set('#seg-C', { rotate: 0, transformOrigin: CX + 'px ' + CY + 'px' });
    gsap.set('#stars', { opacity: 0 });
    gsap.set('#black', { opacity: 0 });
    WRITE.forEach(function (s) { gsap.set('#rect-' + s.k, { attr: { width: 0 } }); });

    var t = gsap.timeline();

    function drop(id, at) {
      t.fromTo('#' + id, { opacity: 0, y: -90 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, at);
    }
    function write(key, at, dur) {
      var s = WRITE.filter(function (w) { return w.k === key; })[0];
      t.set('#seg-' + key, { opacity: 1 }, at);
      t.to('#rect-' + key, { attr: { width: s.w }, duration: dur, ease: 'none' }, at);
    }

    drop('seg-A', 0);
    write('ditya', 0.34, 0.52);
    drop('seg-C', 0.86);
    write('handra', 1.2, 0.58);
    drop('seg-P', 1.78);
    write('rajapati', 2.12, 0.62);

    // the C takes over
    t.to(['#seg-A', '#seg-ditya', '#seg-handra', '#seg-P', '#seg-rajapati'],
      { opacity: 0, duration: 0.55, ease: 'power2.inOut' }, 3.05);
    t.to('#scene', { scale: 2.6, duration: 1.1, ease: 'power2.inOut' }, 3.05);
    t.add(function () { if (!raf) { t0 = performance.now(); raf = requestAnimationFrame(drawStars); } }, 3.1);
    t.to('#stars', { opacity: 1, duration: 0.5 }, 3.2);
    t.to('#seg-C', { rotate: 22, duration: 1.4, ease: 'power1.in' }, 3.3);

    // fall into it
    t.to('#scene', { scale: 16, duration: 0.95, ease: 'power2.in' }, 4.25);
    t.to('#stars', { opacity: 0, duration: 0.6 }, 4.55);
    t.to('#black', { opacity: 1, duration: 0.7, ease: 'power2.in' }, 4.5);
    t.add(stopStars, 5.35);

    t.timeScale(slow ? 0.35 : 1);
    return t;
  }

  function play() {
    if (tl) tl.kill();
    tl = build();
  }

  document.getElementById('replay').addEventListener('click', function (e) {
    e.stopPropagation();
    play();
  });
  document.getElementById('slow').addEventListener('click', function (e) {
    e.stopPropagation();
    slow = !slow;
    e.target.textContent = 'Slow motion: ' + (slow ? 'on' : 'off');
    if (tl) tl.timeScale(slow ? 0.35 : 1);
  });
  document.getElementById('stage').addEventListener('click', function () {
    if (tl) tl.progress(1);
  });

  play();

  // ?t=2.4 freezes the sequence at that second - handy for inspecting a single beat.
  var qs = new URLSearchParams(location.search);
  if (qs.has('t')) {
    var at = parseFloat(qs.get('t')) || 0;
    tl.pause(at);
    if (at >= 3.1 && !raf) { t0 = performance.now(); raf = requestAnimationFrame(drawStars); }
  }
})();
