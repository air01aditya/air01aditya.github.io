<style>
  :root { color-scheme: light; --ink: #101010; }
  * { box-sizing: border-box; }

  #bg { position: fixed; inset: 0; background: #FCFCFB; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; cursor: pointer; }
  #sig { width: min(80vw, 1000px); height: auto; overflow: visible; }

  #sig path.ink { fill: var(--ink); fill-rule: evenodd; }
  .seg { opacity: 0; }
  #ring { fill: none; stroke: var(--ink); stroke-width: 10; opacity: 0; }
  #nib { fill: var(--ink); opacity: 0; }
  #stars { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px;
           justify-content: center; padding: 16px; z-index: 10; }
  button { font: 500 13px -apple-system, "Segoe UI", sans-serif; padding: 9px 16px;
           border-radius: 8px; border: 1px solid #C6613F; background: #C6613F;
           color: #FCFCFB; cursor: pointer; }
  button.ghost { background: transparent; color: #8A897F; border-color: #6a6a62; }
  button:hover { background: #AE5133; border-color: #AE5133; color: #FCFCFB; }
  #hint { position: fixed; top: 18px; left: 0; right: 0; text-align: center;
          font-size: 12px; letter-spacing: .05em; color: #A9A79D; }

    var r = document.getElementById('ring').getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  var P = [];
  for (var i = 0; i < 320; i++) {
    P.push({ a: Math.random() * Math.PI * 2, r: 110 + Math.random() * 660,
             sp: 0.5 + Math.random() * 1.7, len: 8 + Math.random() * 32,
             w: 0.4 + Math.random() * 1.2 });
  }

  function drawStars(now) {
    var dt = Math.min(48, now - t0); t0 = now;
    var k = slow ? 0.4 : 1;
    var c = ringScreen();
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ctx.lineCap = 'round';
    for (var j = 0; j < P.length; j++) {
      var p = P[j];
      p.a += (p.sp * 0.0019 * dt * k) * (1 + 150 / Math.max(40, p.r));
      p.r -= p.sp * 0.055 * dt * k;
      if (p.r < 24) { p.r = 560 + Math.random() * 340; p.a = Math.random() * Math.PI * 2; }
      var x1 = c.x + Math.cos(p.a) * p.r, y1 = c.y + Math.sin(p.a) * p.r * tilt;
      var a2 = p.a - p.len / Math.max(60, p.r), r2 = p.r + p.len * 0.5;
      var x2 = c.x + Math.cos(a2) * r2, y2 = c.y + Math.sin(a2) * r2 * tilt;
      var fade = Math.max(0, Math.min(1, (660 - p.r) / 440));
      ctx.strokeStyle = 'rgba(' + starInk + ',' + (0.12 + fade * 0.7) + ')';
      ctx.lineWidth = p.w;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    raf = requestAnimationFrame(drawStars);
  }
  function stopStars() {
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    ctx.clearRect(0, 0, innerWidth, innerHeight);
  }

  function build() {
    stopStars();
    tilt = 1;
    gsap.set('#sig path.ink', { fill: '#101010' });
    gsap.set('#ring', { stroke: '#101010' });
    gsap.set('#nib', { fill: '#101010' });
    gsap.set('#bg', { backgroundColor: '#FCFCFB' });
    gsap.set('.seg', { opacity: 0 });
    // GSAP measures SVG transformOrigin in px from the element's own bbox,
    // not from the SVG user space - so convert. The ring's bbox is centred
    // on the ellipse already, hence plain 50% 50% there.
    var bb = document.getElementById('scene').getBBox();
    gsap.set('#scene', { scale: 1, transformOrigin: (CX - bb.x) + 'px ' + (CY - bb.y) + 'px' });
    gsap.set('#ringwrap', { scaleX: 1, scaleY: 1, rotate: RING.rot, transformOrigin: '50% 50%' });
    gsap.set('#ring', { opacity: 0, attr: { 'stroke-dasharray': RING.covered + ' 1' } });
    gsap.set('#nib', { opacity: 0 });
    gsap.set('#stars', { opacity: 0 });
    CAPS.forEach(function (k) { gsap.set('#seg-' + k, { x: START_DX[k], y: -90 }); });
    RUNS.forEach(function (k) { gsap.set('#pen-' + k, { attr: { 'stroke-dashoffset': 1 } }); });

    var t = gsap.timeline();

    // 1. the three capitals fall in together, still bunched up
    CAPS.forEach(function (k, i) {
      t.to('#seg-' + k, { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, i * 0.08);
    });
    // 2. they make space
    CAPS.forEach(function (k) {
      t.to('#seg-' + k, { x: 0, duration: 0.8, ease: 'power2.inOut' }, 0.8);
    });

    // 3. the cursive writes itself in, a nib riding the front of each run
    var at = 1.5;
    RUNS.forEach(function (k, i) {
      var dur = [0.66, 0.58, 0.72][i];
      var path = document.getElementById('pen-' + k);
      var total = path.getTotalLength();
      t.set('#seg-' + k, { opacity: 1 }, at);
      t.set('#nib', { opacity: 1 }, at);
      t.to('#pen-' + k, {
        attr: { 'stroke-dashoffset': 0 }, duration: dur, ease: 'none',
        onUpdate: function () {
          var prog = 1 - parseFloat(path.getAttribute('stroke-dashoffset'));
          var pt = path.getPointAtLength(Math.max(0, Math.min(1, prog)) * total);
          nib.setAttribute('cx', pt.x); nib.setAttribute('cy', pt.y);
        }
      }, at);
      at += dur - 0.06;
    });
    t.to('#nib', { opacity: 0, duration: 0.25 }, at);

    // 4. the world inverts - paper to void, ink to light
    var flip = at + 0.4;
    t.to('#bg', { backgroundColor: '#000000', duration: 0.75, ease: 'power2.inOut' }, flip);
    t.to('#sig path.ink', { fill: '#FCFCFB', duration: 0.75, ease: 'power2.inOut' }, flip);
    t.to('#ring', { stroke: '#FCFCFB', duration: 0.75, ease: 'power2.inOut' }, flip);
    t.to('#nib', { fill: '#FCFCFB', duration: 0.75, ease: 'power2.inOut' }, flip);

    // 5. the C closes into the O fitted to it
    var close = flip + 1.35;   // let the white name sit on black for a beat
    t.to(['#seg-A', '#seg-ditya', '#seg-handra', '#seg-P', '#seg-rajapati'],
      { opacity: 0, duration: 0.5, ease: 'power2.inOut' }, close);
    t.to('#ring', { opacity: 1, duration: 0.3 }, close);
    t.to('#seg-C', { opacity: 0, duration: 0.4 }, close + 0.15);
    t.to('#ring', { attr: { 'stroke-dasharray': '1 1' }, duration: 0.6, ease: 'power2.inOut' }, close + 0.1);
    t.to('#scene', { scale: 2.3, duration: 1.2, ease: 'power2.inOut' }, close);

    // 6. the O tips into an accretion disc and starts pulling
    var whirl = close + 0.75;
    t.to('#ringwrap', { scaleY: 0.32, duration: 0.7, ease: 'power2.inOut' }, whirl);
    t.to({ v: 1 }, { v: 0.32, duration: 0.7, ease: 'power2.inOut',
      onUpdate: function () { tilt = this.targets()[0].v; } }, whirl);
    t.add(function () { if (!raf) { t0 = performance.now(); raf = requestAnimationFrame(drawStars); } }, whirl - 0.2);
    t.to('#stars', { opacity: 1, duration: 0.6 }, whirl - 0.15);
    t.to('#ringwrap', { rotate: RING.rot + 320, duration: 1.7, ease: 'power2.in' }, whirl + 0.45);

    // 7. fall in - the void is already black, so everything just goes
    var fall = whirl + 1.3;
    t.to('#scene', { scale: 24, duration: 1.05, ease: 'power2.in' }, fall);
    t.to('#stars', { opacity: 0, duration: 0.6 }, fall + 0.35);
    t.to('#ring', { opacity: 0, duration: 0.5 }, fall + 0.5);
    t.add(stopStars, fall + 1.15);

    t.timeScale(slow ? 0.35 : 1);
    return t;
  }

  function play() { if (tl) tl.kill(); tl = build(); }

  document.getElementById('replay').addEventListener('click', function (e) { e.stopPropagation(); play(); });
  document.getElementById('slow').addEventListener('click', function (e) {
    e.stopPropagation(); slow = !slow;
    e.target.textContent = 'Slow motion: ' + (slow ? 'on' : 'off');
    if (tl) tl.timeScale(slow ? 0.35 : 1);
  });
  document.getElementById('stage').addEventListener('click', function () { if (tl) tl.progress(1); });

  play();

  // ?t=4.2 freezes the sequence at that second - handy for inspecting one beat.
  var qs = new URLSearchParams(location.search);
  if (qs.has('t')) {
    var atq = parseFloat(qs.get('t')) || 0;
    tl.pause(atq);
    if (!raf) { t0 = performance.now(); raf = requestAnimationFrame(drawStars); }
  }
})();
</script>
</body>
</html>
