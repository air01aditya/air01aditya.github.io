    P.push({ a: Math.random() * Math.PI * 2, r: 110 + Math.random() * 640,
             sp: 0.5 + Math.random() * 1.7, len: 8 + Math.random() * 30,
             w: 0.4 + Math.random() * 1.2 });
  }
  var tilt = 1;

  function drawStars(now) {
    var dt = Math.min(48, now - t0); t0 = now;
    var k = slow ? 0.4 : 1;
    var c = ringScreen();
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ctx.lineCap = 'round';
    for (var j = 0; j < P.length; j++) {
      var p = P[j];
      p.a += (p.sp * 0.0019 * dt * k) * (1 + 150 / Math.max(40, p.r));
      p.r -= p.sp * 0.055 * dt * k;
      if (p.r < 24) { p.r = 540 + Math.random() * 340; p.a = Math.random() * Math.PI * 2; }
      var x1 = c.x + Math.cos(p.a) * p.r, y1 = c.y + Math.sin(p.a) * p.r * tilt;
      var a2 = p.a - p.len / Math.max(60, p.r), r2 = p.r + p.len * 0.5;
      var x2 = c.x + Math.cos(a2) * r2, y2 = c.y + Math.sin(a2) * r2 * tilt;
      var fade = Math.max(0, Math.min(1, (640 - p.r) / 430));
      ctx.strokeStyle = 'rgba(16,16,16,' + (0.09 + fade * 0.58) + ')';
      ctx.lineWidth = p.w;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    raf = requestAnimationFrame(drawStars);
  }
  function stopStars() {
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    ctx.clearRect(0, 0, innerWidth, innerHeight);
  }

  function build() {
    stopStars();
    tilt = 1;
    gsap.set('.seg', { opacity: 0 });
    gsap.set('#scene', { scale: 1, rotate: 0, transformOrigin: CX + 'px ' + CY + 'px' });
    gsap.set('#ring', { opacity: 0, scale: 1, scaleY: 1, rotate: 0,
                        transformOrigin: CX + 'px ' + CY + 'px',
                        attr: { 'stroke-dasharray': '0.74 1' } });
    gsap.set('#nib', { opacity: 0 });
    gsap.set('#stars', { opacity: 0 });
    gsap.set('#black', { opacity: 0 });
    CAPS.forEach(function (k) { gsap.set('#seg-' + k, { x: START_DX[k], y: -90 }); });
    RUNS.forEach(function (k) { gsap.set('#pen-' + k, { attr: { 'stroke-dashoffset': 1 } }); });

    var t = gsap.timeline();

    // 1. the three capitals fall in together, still bunched up
    CAPS.forEach(function (k, i) {
      t.to('#seg-' + k, { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, i * 0.08);
    });

    // 2. they make space
    CAPS.forEach(function (k) {
      t.to('#seg-' + k, { x: 0, duration: 0.8, ease: 'power2.inOut' }, 0.8);
    });

    // 3. the cursive writes itself into the gaps, with a nib riding the front
    var at = 1.5;
    RUNS.forEach(function (k, i) {
      var dur = [0.62, 0.55, 0.68][i];
      var path = document.getElementById('pen-' + k);
      var total = path.getTotalLength();
      t.set('#seg-' + k, { opacity: 1 }, at);
      t.set('#nib', { opacity: 1 }, at);
      t.to('#pen-' + k, {
        attr: { 'stroke-dashoffset': 0 }, duration: dur, ease: 'none',
        onUpdate: function () {
          var prog = 1 - parseFloat(path.getAttribute('stroke-dashoffset'));
          var pt = path.getPointAtLength(Math.max(0, Math.min(1, prog)) * total);
          nib.setAttribute('cx', pt.x); nib.setAttribute('cy', pt.y);
        }
      }, at);
      at += dur - 0.06;
    });
    t.to('#nib', { opacity: 0, duration: 0.25 }, at);

    // 4. the C closes into an O
    var hold = at + 0.35;
    t.to(['#seg-A', '#seg-ditya', '#seg-handra', '#seg-P', '#seg-rajapati'],
      { opacity: 0, duration: 0.5, ease: 'power2.inOut' }, hold);
    t.to('#ring', { opacity: 1, duration: 0.35 }, hold + 0.1);
    t.to('#seg-C', { opacity: 0, duration: 0.45 }, hold + 0.2);
    t.to('#ring', { attr: { 'stroke-dasharray': '1 1' }, duration: 0.6, ease: 'power2.inOut' }, hold + 0.15);
    t.to('#scene', { scale: 2.3, duration: 1.1, ease: 'power2.inOut' }, hold);

    // 5. the O tips over into an accretion disc and starts pulling
    var whirl = hold + 0.8;
    t.to('#ring', { scaleY: 0.34, rotate: 14, duration: 0.7, ease: 'power2.inOut' }, whirl);
    t.to({ v: 1 }, { v: 0.34, duration: 0.7, ease: 'power2.inOut',
      onUpdate: function () { tilt = this.targets()[0].v; } }, whirl);
    t.add(function () { if (!raf) { t0 = performance.now(); raf = requestAnimationFrame(drawStars); } }, whirl - 0.15);
    t.to('#stars', { opacity: 1, duration: 0.5 }, whirl - 0.1);
    t.to('#ring', { rotate: 300, duration: 1.6, ease: 'power2.in' }, whirl + 0.5);

    // 6. fall in
    var fall = whirl + 1.25;
    t.to('#scene', { scale: 22, duration: 1.0, ease: 'power2.in' }, fall);
    t.to('#stars', { opacity: 0, duration: 0.6 }, fall + 0.3);
    t.to('#black', { opacity: 1, duration: 0.7, ease: 'power2.in' }, fall + 0.25);
    t.add(stopStars, fall + 1.1);

    t.timeScale(slow ? 0.35 : 1);
    return t;
  }

  function play() { if (tl) tl.kill(); tl = build(); }

  document.getElementById('replay').addEventListener('click', function (e) { e.stopPropagation(); play(); });
  document.getElementById('slow').addEventListener('click', function (e) {
    e.stopPropagation(); slow = !slow;
    e.target.textContent = 'Slow motion: ' + (slow ? 'on' : 'off');
    if (tl) tl.timeScale(slow ? 0.35 : 1);
  });
  document.getElementById('stage').addEventListener('click', function () { if (tl) tl.progress(1); });

  play();

  // ?t=2.4 freezes the sequence at that second - handy for inspecting one beat.
  var qs = new URLSearchParams(location.search);
  if (qs.has('t')) {
    var atq = parseFloat(qs.get('t')) || 0;
    tl.pause(atq);
    if (!raf) { t0 = performance.now(); raf = requestAnimationFrame(drawStars); }
  }
})();
</script>
</body>
</html>
