  #sig path.ink { fill: #101010; fill-rule: evenodd; }

  #stars { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px;

  button { font: 500 13px -apple-system, "Segoe UI", sans-serif; padding: 9px 16px;
           border-radius: 8px; border: 1px solid #C6613F; background: #C6613F;
           color: #FCFCFB; cursor: pointer; }
  button.ghost { background: transparent; color: #6B6A63; border-color: #D9D8D0; }
  button:hover { background: #AE5133; border-color: #AE5133; color: #FCFCFB; }
  #hint { position: fixed; top: 18px; left: 0; right: 0; text-align: center;

<div id="panel">
  <button id="replay">Replay</button>
  <button class="ghost" id="slow">Slow motion: off</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function () {
  var RING = {"cx":475.1,"cy":120.1,"rx":105.8,"ry":50.7,"rot":-46.1,"covered":0.81};
  var CX = RING.cx, CY = RING.cy;
  var CAPS = ["A","C","P"];
  var RUNS = ["ditya","handra","rajapati"];
  var OTHERS = ["#seg-A","#seg-P","#seg-ditya","#seg-handra","#seg-rajapati"];
  var START_DX = {"A":216,"C":2,"P":-118};
  var stars = document.getElementById('stars');
  var ctx = stars.getContext('2d');
  var nib = document.getElementById('nib');
  var tl = null, slow = false, raf = null, t0 = 0;
  var pull = 0;   // 0 = drifting, 1 = dragged hard into the ring

  function sizeCanvas() {
    var d = window.devicePixelRatio || 1;
    stars.width = innerWidth * d; stars.height = innerHeight * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  addEventListener('resize', sizeCanvas); sizeCanvas();

  // Where the O sits on screen and how big it is. The dots orbit that, tilted
  // to match the ellipse, so they read as part of the same object.
  function ohScreen() {
    var r = document.getElementById('oh').getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2, s: Math.max(30, r.width / 2) };
  }

  var rot = RING.rot * Math.PI / 180;
  var squash = RING.ry / RING.rx;

  var P = [];
  for (var i = 0; i < 240; i++) {
    P.push({ a: Math.random() * Math.PI * 2,
             r: 1.05 + Math.random() * 2.4,
             sp: 0.6 + Math.random() * 1.8,
             sz: 0.8 + Math.random() * 1.9,
             tail: 0.02 + Math.random() * 0.09 });
  }

  function drawStars(now) {
    var dt = Math.min(48, now - t0); t0 = now;
    var k = slow ? 0.4 : 1;
    var o = ohScreen();
    var ca = Math.cos(rot), sa = Math.sin(rot);
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ctx.lineCap = 'round';

    function at(ang, rr) {
      var u = Math.cos(ang) * rr, v = Math.sin(ang) * rr * squash;
      return [o.x + (u * ca - v * sa) * o.s, o.y + (u * sa + v * ca) * o.s];
    }

    for (var j = 0; j < P.length; j++) {
      var p = P[j];
      p.a += p.sp * (0.0022 + 0.011 * pull) * dt * k * (1 + 0.7 / Math.max(0.35, p.r));
      p.r -= (0.00012 + 0.0018 * pull) * p.sp * dt * k;
      if (p.r < 0.97) { p.r = 2.4 + Math.random() * 1.4; p.a = Math.random() * Math.PI * 2; }

      var q = at(p.a, p.r);
      var q2 = at(p.a - p.tail * (0.35 + pull), p.r);
      var nearness = Math.max(0, Math.min(1, (2.1 - p.r) / 1.1));
      ctx.strokeStyle = 'rgba(16,16,16,' + (0.10 + nearness * 0.72) + ')';
      ctx.lineWidth = p.sz;
      ctx.beginPath(); ctx.moveTo(q2[0], q2[1]); ctx.lineTo(q[0], q[1]); ctx.stroke();
    }
    raf = requestAnimationFrame(drawStars);
  }
  function stopStars() {
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    ctx.clearRect(0, 0, innerWidth, innerHeight);
  }

  function build() {
    stopStars();
    pull = 0;
    gsap.set('#bg', { backgroundColor: '#FCFCFB' });
    gsap.set('.seg', { opacity: 0 });
    // GSAP measures SVG transformOrigin in px from the element's own bbox,
    // not from the SVG user space - so convert.
    var bb = document.getElementById('scene').getBBox();
    gsap.set('#scene', { scale: 1, transformOrigin: (CX - bb.x) + 'px ' + (CY - bb.y) + 'px' });
    gsap.set('#gap', { attr: { 'stroke-dashoffset': 1 }, opacity: 1 });
    gsap.set('#nib', { opacity: 0 });
    gsap.set('#stars', { opacity: 0 });
    CAPS.forEach(function (k) { gsap.set('#seg-' + k, { x: START_DX[k], y: -90 }); });
    RUNS.forEach(function (k) { gsap.set('#pen-' + k, { attr: { 'stroke-dashoffset': 1 } }); });

    var t = gsap.timeline();

    // 1. the three capitals fall in together, still bunched up
    CAPS.forEach(function (k, i) {
      t.to('#seg-' + k, { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, i * 0.08);
    });
    // 2. they make space
    CAPS.forEach(function (k) {
      t.to('#seg-' + k, { x: 0, duration: 0.8, ease: 'power2.inOut' }, 0.8);
    });

    // 3. the cursive writes itself in, a nib riding the front of each run
    var at = 1.5;
    RUNS.forEach(function (k, i) {
      var dur = [0.7, 0.6, 0.78][i];
      var path = document.getElementById('pen-' + k);
      var total = path.getTotalLength();
      t.set('#seg-' + k, { opacity: 1 }, at);
      t.set('#nib', { opacity: 1 }, at);
      t.to('#pen-' + k, {
        attr: { 'stroke-dashoffset': 0 }, duration: dur, ease: 'none',
        onUpdate: function () {
          var prog = 1 - parseFloat(path.getAttribute('stroke-dashoffset'));
          var pt = path.getPointAtLength(Math.max(0, Math.min(1, prog)) * total);
          nib.setAttribute('cx', pt.x); nib.setAttribute('cy', pt.y);
        }
      }, at);
      at += dur - 0.06;
    });
    t.to('#nib', { opacity: 0, duration: 0.25 }, at);

    // 4. the name holds, then everything but the C lets go
    var alone = at + 0.8;
    t.to(OTHERS, { opacity: 0, duration: 0.7, ease: 'power2.inOut' }, alone);

    // 5. the C comes forward
    t.to('#scene', { scale: 2.2, duration: 1.5, ease: 'power2.inOut' }, alone);

    // 6. dots swarm, faster and faster, and draw in the missing arc -
    //    the C closes into an O
    var swarm = alone + 0.45;
    t.add(function () { if (!raf) { t0 = performance.now(); raf = requestAnimationFrame(drawStars); } }, swarm - 0.25);
    t.to('#stars', { opacity: 1, duration: 0.6 }, swarm - 0.2);
    t.to({ v: 0 }, { v: 1, duration: 1.2, ease: 'power2.in',
      onUpdate: function () { pull = this.targets()[0].v; } }, swarm);
    t.to('#gap', { attr: { 'stroke-dashoffset': 0 }, duration: 0.95, ease: 'power2.inOut' }, swarm + 0.4);

    // 7. the O grows and grows while they orbit
    var grow = swarm + 1.45;
    t.to('#scene', { scale: 7.5, duration: 2.5, ease: 'power1.in' }, grow);

    // 8. everything lets go slowly, and the page is left black
    var out = grow + 1.4;
    t.to(['#seg-C', '#gap'], { opacity: 0, duration: 1.5, ease: 'power2.in' }, out);
    t.to('#stars', { opacity: 0, duration: 1.6, ease: 'power2.in' }, out + 0.15);
    t.to('#bg', { backgroundColor: '#000000', duration: 1.5, ease: 'power2.inOut' }, out + 0.1);
    t.add(stopStars, out + 1.9);

    t.timeScale(slow ? 0.35 : 1);
    return t;
  }

  function play() { if (tl) tl.kill(); tl = build(); }

  document.getElementById('replay').addEventListener('click', function (e) { e.stopPropagation(); play(); });
  document.getElementById('slow').addEventListener('click', function (e) {
    e.stopPropagation(); slow = !slow;
    e.target.textContent = 'Slow motion: ' + (slow ? 'on' : 'off');
    if (tl) tl.timeScale(slow ? 0.35 : 1);
  });
  document.getElementById('stage').addEventListener('click', function () { if (tl) tl.progress(1); });

  play();

  // ?t=5.2 freezes the sequence at that second - handy for inspecting one beat.
  var qs = new URLSearchParams(location.search);
  if (qs.has('t')) {
    var atq = parseFloat(qs.get('t')) || 0;
    tl.pause(atq);
    if (!raf) { t0 = performance.now(); raf = requestAnimationFrame(drawStars); }
  }
})();
</script>
