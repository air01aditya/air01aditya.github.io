  sizeStars();
  addEventListener('resize', sizeStars);

  function twinkle() {
    var k = slow ? 0.4 : 1;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (var i = 0; i < S.length; i++) {
      var st = S[i];
      st.p += st.s * k;
      var a = (0.28 + Math.abs(Math.sin(st.p)) * 0.72) * st.b;
      ctx.fillStyle = 'rgba(200,228,242,' + a.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 6.283); ctx.fill();
    }
    raf = requestAnimationFrame(twinkle);
  }
  function startStars() { if (!raf) raf = requestAnimationFrame(twinkle); }
  function stopStars() {
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    ctx.clearRect(0, 0, innerWidth, innerHeight);
  }

  function build() {
    stopStars();
    gsap.set('#stars', { opacity: 0 });
    gsap.set('#bg', { backgroundColor: '#FCFCFB' });
    gsap.set('.seg', { opacity: 0 });
    gsap.set('#nib', { opacity: 0 });
    CAPS.forEach(function (k) { gsap.set('#seg-' + k, { x: START_DX[k], y: -90 }); });
    RUNS.forEach(function (k) { gsap.set('#pen-' + k, { attr: { 'stroke-dashoffset': 1 } }); });

    var t = gsap.timeline();

    // 1. the three capitals fall in together, still bunched up
    CAPS.forEach(function (k, i) {
      t.to('#seg-' + k, { opacity: 1, y: 0, duration: 0.62, ease: 'power3.out' }, i * 0.1);
    });

    // 2. they make space
    CAPS.forEach(function (k) {
      t.to('#seg-' + k, { x: 0, duration: 0.95, ease: 'power2.inOut' }, 0.9);
    });

    // 3. the cursive writes itself into the gaps, a nib riding the front
    var at = 1.75;
    RUNS.forEach(function (k, i) {
      var dur = [1.15, 1.0, 1.3][i];
      var path = document.getElementById('pen-' + k);
      var total = path.getTotalLength();
      t.set('#seg-' + k, { opacity: 1 }, at);
      t.set('#nib', { opacity: 1 }, at);
      t.to('#pen-' + k, {
        attr: { 'stroke-dashoffset': 0 }, duration: dur, ease: 'none',
        onUpdate: function () {
          var prog = 1 - parseFloat(path.getAttribute('stroke-dashoffset'));
          var pt = path.getPointAtLength(Math.max(0, Math.min(1, prog)) * total);
          nib.setAttribute('cx', pt.x); nib.setAttribute('cy', pt.y);
        }
      }, at);
      at += dur - 0.07;
    });
    t.to('#nib', { opacity: 0, duration: 0.3 }, at);

    // 4. the finished name holds, then the page goes to black
    var hold = at + 0.95;
    t.to(ALL, { opacity: 0, duration: 1.3, ease: 'power2.inOut' }, hold);
    t.to('#bg', { backgroundColor: '#000000', duration: 1.4, ease: 'power2.inOut' }, hold + 0.1);
    t.add(startStars, hold + 0.35);
    t.to('#stars', { opacity: 1, duration: 1.8, ease: 'power1.inOut' }, hold + 0.45);

    t.timeScale(slow ? 0.35 : 1);
    return t;
  }

  function play() { if (tl) tl.kill(); tl = build(); }

  document.getElementById('replay').addEventListener('click', function (e) { e.stopPropagation(); play(); });
  document.getElementById('slow').addEventListener('click', function (e) {
    e.stopPropagation(); slow = !slow;
    e.target.textContent = 'Slow motion: ' + (slow ? 'on' : 'off');
    if (tl) tl.timeScale(slow ? 0.35 : 1);
  });
  document.getElementById('stage').addEventListener('click', function () { if (tl) tl.progress(1); });

  play();

  // ?t=3.2 freezes the sequence at that second - handy for inspecting one beat.
  var qs = new URLSearchParams(location.search);
  if (qs.has('t')) {
    tl.pause(parseFloat(qs.get('t')) || 0);
    startStars();   // .add() callbacks do not fire on a seek
  }
})();
</script>
</body>
</html>
